name: Build APK

# Runs on every push to main, or manually from the Actions tab ("Run workflow")
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # GitHub's Ubuntu machines already have the Android SDK installed
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlertAlarm.apk

      # Publishes the APK on the repo's Releases page, so it can be downloaded straight to the phone
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" AlertAlarm.apk \
            --title "AlertAlarm (build ${{ github.run_number }})" \
            --notes "Download AlertAlarm.apk on your phone and install it." \
            --latest
